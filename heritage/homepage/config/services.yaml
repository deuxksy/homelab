# Homepage Services Configuration - The Heritage Collection
# https://gethomepage.dev/configs/services/

- Info:
    - Calendar:
        widget:
          type: calendar
          firstDayInWeek: sunday
          view: monthly
          maxEvents: 10
          showTime: true

- Media:
    - Transmission:
        label: "Torrent Node"
        icon: transmission.png
        href: https://heritage.bun-bull.ts.net/transmission/web/
        container: transmission
        widget:
          type: transmission
          url: http://localhost:8091

    - Aria2:
        label: "Download Manager"
        icon: aria-ng.png
        container: aria2
        # Web UI 없음 (RPC 클라이언트만) — href 미사용, 컨테이너 상태 카드만

- Streaming:
    - Jellyfin:
        label: "Media Server"
        icon: jellyfin.png
        href: https://heritage.bun-bull.ts.net/jellyfin
        container: jellyfin
        widget:
          type: jellyfin
          # BaseUrl=/jellyfin 설정이라 위젯 URL에도 base path 필수 (/emby/*가 302됨)
          url: http://localhost:8096/jellyfin
          key: "{{HOMEPAGE_VAR_KEY_JELLYFIN}}"
          enableBlocks: true
          enableNowPlaying: true
          enableUser: true
          showEpisodeNumber: true
          expandOneStreamToTwoRows: false

- Photos:
    - Immich:
        label: "Photo Gallery"
        icon: immich.png
        href: https://heritage.bun-bull.ts.net:2283
        container: immich_server
