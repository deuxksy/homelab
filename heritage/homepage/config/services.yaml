# Homepage Services Configuration - The Heritage Collection
# https://gethomepage.dev/configs/services/

- Info:
    - Calendar:
        widget:
          type: calendar
          firstDayInWeek: sunday
          view: monthly
          maxEvents: 10
          showTime: true

- Media:
    - Transmission:
        label: "Torrent Node"
        icon: transmission.png
        href: https://heritage.bun-bull.ts.net/transmission/web/
        container: transmission
        widget:
          type: transmission
          url: http://localhost:8091

    - Aria2:
        label: "Download Manager"
        icon: aria-ng.png
        href: https://heritage.bun-bull.ts.net/aria2/
        container: aria2

- Streaming:
    - Jellyfin:
        label: "Media Server"
        icon: jellyfin.png
        href: https://heritage.bun-bull.ts.net/jellyfin
        container: jellyfin
        widget:
          type: jellyfin
          url: http://localhost:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_API_KEY}}"
          enableBlocks: true
          enableNowPlaying: true
          enableUser: true
          showEpisodeNumber: true
          expandOneStreamToTwoRows: false

- Photos:
    - Immich:
        label: "Photo Gallery"
        icon: immich.png
        href: https://heritage.bun-bull.ts.net:2283
        container: immich_server

- Monitoring:
    - Pulse:
        label: "Hardware Monitor"
        href: https://heritage.bun-bull.ts.net:10000
        container: pulse
