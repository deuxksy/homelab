# Homepage Services Configuration - The Heritage Collection
# https://gethomepage.dev/configs/services/

- Info:
    - Calendar:
        widget:
          type: calendar
          firstDayInWeek: sunday
          view: monthly
          maxEvents: 10
          showTime: true

- Infra:
    - Proxmox:
        label: "Hypervisor"
        icon: proxmox.png
        href: https://walle.bun-bull.ts.net
        description: "walle PVE 9.2"
        widget:
          type: proxmox
          # 자가서명 8006은 Node fetch TLS 검증 실패 — Tailscale Serve 443(유효 인증서) 경유
          url: https://walle.bun-bull.ts.net
          username: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_ID}}"
          password: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET}}"
          node: walle
    - Caddy:
        label: "Reverse Proxy"
        icon: caddy.png
        href: https://heritage.bun-bull.ts.net/
        description: "L7 Proxy :9080"
        server: my-docker
        container: caddy
        widget:
          # Caddy admin API (LXC loopback, host 네트워크로 직접 접근)
          type: caddy
          url: http://localhost:2019

- Download:
    - Transmission:
        label: "Torrent Node"
        icon: transmission.png
        href: https://heritage.bun-bull.ts.net/transmission/web/
        server: my-docker
        container: transmission
        widget:
          type: transmission
          url: http://localhost:8091
    - Aria2:
        label: "Download Manager"
        icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/aria2.png
        href: ws://heritage.bun-bull.ts.net:6800/jsonrpc
        server: my-docker
        container: aria2
        widget:
          type: customapi
          url: http://localhost:6800/jsonrpc
          method: POST
          headers:
            Content-Type: application/json
          requestBody:
            jsonrpc: "2.0"
            id: homepage
            method: aria2.getGlobalStat
            params:
              - "token:P3TERX"
          mappings:
            - field: result.numActive
              label: ACTIVE
            - field: result.numWaiting
              label: WAITING
            - field: result.numStopped
              label: STOPPED

- Streaming:
    - Jellyfin:
        label: "Media Server"
        icon: jellyfin.png
        href: https://heritage.bun-bull.ts.net/jellyfin
        server: my-docker
        container: jellyfin
        widget:
          type: jellyfin
          # BaseUrl=/jellyfin 설정이라 위젯 URL에도 base path 필수 (/emby/*가 302됨)
          url: http://localhost:8096/jellyfin
          key: "{{HOMEPAGE_VAR_KEY_JELLYFIN}}"
          enableBlocks: true
          enableNowPlaying: true
          enableUser: true
          showEpisodeNumber: true
          expandOneStreamToTwoRows: false

- Photos:
    - Immich:
        label: "Photo Gallery"
        icon: immich.png
        href: https://heritage.bun-bull.ts.net:2283
        server: my-docker
        container: immich_server
        # homepage 내장 immich 위젯은 v3 API 미지원(/api/server-info/* 404) — customapi 우회
        widget:
          type: customapi
          url: http://localhost:2283/api/server/statistics
          headers:
            x-api-key: "{{HOMEPAGE_VAR_KEY_IMMICH}}"
          mappings:
            - field: photos
              label: PHOTOS
            - field: videos
              label: VIDEOS
