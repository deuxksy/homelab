services:
  # --- L7 Reverse Proxy (Caddy) ---
  caddy:
    image: docker.io/library/caddy:latest
    container_name: caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # --- Dashboard (Homepage) ---
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    env_file:
      - .env
    network_mode: host
    # 앱이 node(uid 1000)로 실행 — docker.sock 접근 위해 docker GID(996) 그룹 추가
    group_add:
      - "996"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Seoul
      - HOMEPAGE_ALLOWED_HOSTS=*
    volumes:
      - ./homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # --- Acquisition Engine: Torrent (Transmission) ---
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    restart: unless-stopped
    ports:
      - "8091:9091"
      - "51413:51413"
      - "51413:51413/udp"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Seoul
    volumes:
      - ./transmission/config:/config
      - ./transmission/data:/data
      - /mnt/data2/torrent/downloads:/downloads
      - /mnt/data1/torrent/complete:/downloads/complete
      - /mnt/data2/torrent/downloads/watch:/watch
    mem_limit: 512m

  # --- Acquisition Engine: Direct Download (Aria2) ---
  aria2:
    image: p3terx/aria2-pro:test
    container_name: aria2
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK_SET=022
      - RPC_PORT=6800
      - LISTEN_PORT=6888
      - DISK_CACHE=64M
      - IPV6_MODE=false
      - UPDATE_TRACKERS=false
      - TZ=Asia/Seoul
    ports:
      - "6800:6800"
      - "6888:6888"
      - "6888:6888/udp"
    volumes:
      - aria2_config:/config
      - /mnt/data2/torrent/downloads/aria:/downloads:rw
    logging:
      driver: json-file
      options:
        max-size: 1m

  # --- Digital Theater (Jellyfin) ---
  jellyfin:
    image: docker.io/jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
    user: "1000:1000"
    environment:
      - TZ=Asia/Seoul
      - JELLYFIN_BaseUrl=/jellyfin
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - /mnt/data2/torrent/downloads:/data1
      - /mnt/data1/torrent/complete:/data2
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # --- Photo Management (Immich) ---
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    container_name: immich_server
    restart: always
    env_file:
      - .env
    ports:
      # 2283 loopback: Tailscale Serve(https 2283) 전용 — tailscaled가 tailnet IP:2283 선점
      # 2284 LAN: TV/폰 등 Tailscale 없는 기기용 직접 접속 (http://<LAN-IP>:2284)
      - "127.0.0.1:2283:2283"
      - "2284:2283"
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /mnt/data2/torrent/downloads/aria:/mnt/aria:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - immich-redis
      - immich-postgres
    # 썸네일/프리뷰 생성 배치가 Jellyfin 재생과 경합하지 않도록 1코어로 제한
    mem_limit: 1.5g
    cpus: "1.0"
    healthcheck:
      disable: false
    # ML 비활성 — IMMICH_MACHINE_LEARNING_URL=false (.env). 탐색형 갤러리 용도로
    # 스마트검색/인물인식 불필요 판단(2026-08-23). 재활성: env 제거 + ML 서비스 복원

  immich-redis:
    image: docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    container_name: immich_redis
    restart: always
    mem_limit: 128m

  immich-postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich_postgres
    restart: always
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    mem_limit: 768m
    healthcheck:
      disable: false

  # --- Hardware Monitoring (Pulse, moni 이전) ---
  pulse:
    image: rcourtman/pulse:latest
    container_name: pulse
    restart: unless-stopped
    ports:
      - "127.0.0.1:7655:7655"
    volumes:
      - pulse_data:/data
    mem_limit: 512m
    cpus: "1.0"
    security_opt:
      - no-new-privileges:true
    environment:
      # B1: 인증 env vars 사용 안 함 — UI setup wizard 초기화 (기존 moni 패턴)
      FRONTEND_PORT: "7655"
      PULSE_METRICS_PORT: "9091"
      PULSE_METRICS_BIND_ADDRESS: "127.0.0.1"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7655/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  aria2_config:
  caddy_data:
  caddy_config:
  pulse_data:
