services:
  # --- L7 Reverse Proxy (Caddy) ---
  caddy:
    image: docker.io/library/caddy:latest
    container_name: caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # --- Dashboard (Homepage) ---
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    env_file:
      - .env
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Seoul
      - HOMEPAGE_ALLOWED_HOSTS=*
    volumes:
      - ./homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # --- Acquisition Engine: Torrent (Transmission) ---
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: transmission
    restart: unless-stopped
    ports:
      - "8091:9091"
      - "51413:51413"
      - "51413:51413/udp"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Seoul
    volumes:
      - ./transmission/config:/config
      - ./transmission/data:/data
      - /mnt/data2/torrent/downloads:/downloads
      - /mnt/data1/torrent/complete:/downloads/complete
      - /mnt/data2/torrent/downloads/watch:/watch
    mem_limit: 512m

  # --- Acquisition Engine: Direct Download (Aria2) ---
  aria2:
    image: p3terx/aria2-pro:test
    container_name: aria2
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK_SET=022
      - RPC_PORT=6800
      - LISTEN_PORT=6888
      - DISK_CACHE=64M
      - IPV6_MODE=false
      - UPDATE_TRACKERS=false
      - TZ=Asia/Seoul
    ports:
      - "6800:6800"
      - "6888:6888"
      - "6888:6888/udp"
    volumes:
      - aria2_config:/config
      - /mnt/data2/torrent/downloads/aria:/downloads:rw
    logging:
      driver: json-file
      options:
        max-size: 1m

  # --- Digital Theater (Jellyfin) ---
  jellyfin:
    image: docker.io/jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
    user: "1000:1000"
    environment:
      - TZ=Asia/Seoul
      - JELLYFIN_BaseUrl=/jellyfin
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - /mnt/data2/torrent/downloads:/data1
      - /mnt/data1/torrent/complete:/data2
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  aria2_config:
  caddy_data:
  caddy_config:
